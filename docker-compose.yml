version: "3.9"
# Aegis project — Redis only. Python services run locally via uvicorn.
# Port 6380 on host to avoid conflicts with any existing Redis on 6379.
services:
  redis-aegis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres-aegis:
    image: postgres:15-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegispassword
      POSTGRES_DB: aegis
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aegis"]
      interval: 5s
      timeout: 3s
      retries: 5
  rabbitmq-aegis:
    image: rabbitmq:3-alpine
    container_name: aegis-rabbitmq
    ports:
      - "5673:5672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  policy-extractor:
    build: .
    container_name: aegis-policy-extractor
    command: python -m engine.policy_service
    ports:
      - "8004:8004"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  anomaly-detector:
    build: .
    container_name: aegis-anomaly-detector
    command: python -m engine.anomaly_service
    ports:
      - "8005:8005"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
