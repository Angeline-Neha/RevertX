version: "3.9"
# Aegis project — Redis only. Python services run locally via uvicorn.
# Port 6380 on host to avoid conflicts with any existing Redis on 6379.
services:
  redis-aegis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres-aegis:
    image: postgres:15-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegispassword
      POSTGRES_DB: aegis
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aegis"]
      interval: 5s
      timeout: 3s
      retries: 5
  rabbitmq-aegis:
    image: rabbitmq:3-alpine
    container_name: aegis-rabbitmq
    ports:
      - "5673:5672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # NOTE on REDIS_HOST/PG_HOST below: inside a container, "localhost"
  # means the container itself, not the redis-aegis/postgres-aegis
  # containers — those are only reachable by their Compose service name
  # over the network Compose creates automatically. Previously these two
  # services didn't set REDIS_HOST/REDIS_PORT (or PG_*) at all, so they
  # silently fell back to policy_extractor.py / db/client.py's
  # localhost:6380 / localhost:5433 defaults, which resolve to nothing
  # inside the container. The practical effect: publish_event() (used to
  # stream LLM tokens to the dashboard's "LLM Reasoning" panel) would
  # raise a Redis connection error on the very first chunk — previously
  # this bubbled up as an unhandled exception with the real cause
  # discarded; it's now caught with the reason preserved (see
  # engine/policy_extractor.py), but the actual fix is to make sure these
  # containers can reach Redis/Postgres at all. Ports use the *container*
  # port (6379/5432), not the host-mapped port (6380/5433) above.
  policy-extractor:
    build: .
    container_name: aegis-policy-extractor
    command: python -m engine.policy_service
    ports:
      - "8004:8004"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_HOST=redis-aegis
      - REDIS_PORT=6379
      - PG_HOST=postgres-aegis
      - PG_PORT=5432
      - PG_USER=${PG_USER:-aegis}
      - PG_PASSWORD=${PG_PASSWORD:-aegispassword}
      - PG_DB=${PG_DB:-aegis}
    depends_on:
      redis-aegis:
        condition: service_healthy
      postgres-aegis:
        condition: service_healthy
    restart: unless-stopped

  anomaly-detector:
    build: .
    container_name: aegis-anomaly-detector
    command: python -m engine.anomaly_service
    ports:
      - "8005:8005"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_HOST=redis-aegis
      - REDIS_PORT=6379
      - PG_HOST=postgres-aegis
      - PG_PORT=5432
      - PG_USER=${PG_USER:-aegis}
      - PG_PASSWORD=${PG_PASSWORD:-aegispassword}
      - PG_DB=${PG_DB:-aegis}
    depends_on:
      redis-aegis:
        condition: service_healthy
      postgres-aegis:
        condition: service_healthy
    restart: unless-stopped
